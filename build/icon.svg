<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Server/Cloud shape -->
    <rect x="-120" y="-40" width="240" height="80" rx="16" fill="rgba(255,255,255,0.95)"/>
    <circle cx="-80" cy="0" r="12" fill="#1a73e8"/>
    <circle cx="-44" cy="0" r="12" fill="#34a853"/>
    <circle cx="-8" cy="0" r="12" fill="#fbbc04"/>
    <rect x="20" y="-6" width="80" height="4" rx="2" fill="#ccc"/>
    <rect x="20" y="4" width="50" height="4" rx="2" fill="#ccc"/>
    <!-- Arrow up (deploy) -->
    <polygon points="0,-120 30,-80 10,-80 10,-50 -10,-50 -10,-80 -30,-80" fill="rgba(255,255,255,0.9)"/>
    <!-- Bottom bar -->
    <rect x="-120" y="60" width="240" height="80" rx="16" fill="rgba(255,255,255,0.85)"/>
    <circle cx="-80" cy="100" r="12" fill="#1a73e8"/>
    <circle cx="-44" cy="100" r="12" fill="#ea4335"/>
    <circle cx="-8" cy="100" r="12" fill="#34a853"/>
    <rect x="20" y="94" width="80" height="4" rx="2" fill="#ccc"/>
    <rect x="20" y="104" width="60" height="4" rx="2" fill="#ccc"/>
  </g>
</svg>
